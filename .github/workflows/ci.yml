name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Wavvon/Wavvon-server
          ref: develop
          path: wavvon-server
          sparse-checkout: crates/identity/wire-vectors.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: sh scripts/check
        env:
          CI: "true"
          WAVVON_WIRE_VECTORS: wavvon-server/crates/identity/wire-vectors.json
